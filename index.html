function begin(L,seed){seedRng(seed);MBseq=0;MOPEN=0;LEARN.clear();
G={ps:[],prods:[],round:1,i:0,acts:2,waste:0,over:0,mod:{},log:[],q:[],cnt:{s:0,r:0,f:0,c:0},dk:{act:sh(ACT),ev:sh(EV),law:sh(LAW),opp:sh(OPP),prod:sh([...Array(24)].map((_,k)=>[k%4,k/4|0]).filter(x=>!INIT.some(y=>y[0]==x[0]&&y[1]==x[1])))}};
L.forEach((l,i)=>{const r=l.role,R=ROLES[r];G.ps.push({id:i,name:l.name,role:r,fin:R[3],cir:20,law:60,imp:20,cap:{r:R[4],t:R[5],n:R[6]},mat:0,risk:0,loops:0,hand:[],disc:0,rdisc:0,qc:0,free:0,streak:0,inv:0,op:0,cnt:{}});newProd(i,INIT[r])});startRound()}
function newProd(o,[t,v]){G.prods.push({t,v,st:'d',own:o,easy:0,loops:0,rc:T[t][3]+(v>4?1:0)})}
// ===== VÒNG CHƠI =====
function startRound(){const e=nextCard('ev'),M=G.mod=e[2];G.i=0;G.acts=M.acts?1:2;G.q=[];
G.ps.forEach(p=>{p.cnt={cl:0,ref:0,col:0,w:0};p.op=0;gain(p,{fin:2});INC[p.role]&&gain(p,INC[p.role]);p.hand.push(nextCard('act'))});
log(`— Vòng ${G.round}: ${RN[G.round-1]} · Sự kiện: ${e[0]}`);
if(G.round==3)G.prods.forEach(x=>x.st=='u'&&(x.st='b'));
if(M.breakAll)G.ps.forEach(p=>{const x=G.prods.find(x=>x.own==p.id&&x.st=='u');x&&(x.st='b')});
if(M.waste)addWaste(M.waste);
M.fixFin&&G.ps.filter(p=>p.role==2).forEach(p=>gain(p,{fin:2}));
M.repMat&&G.ps.filter(p=>p.role==2).forEach(p=>gain(p,{mat:1}));
M.share&&G.ps.forEach(p=>G.prods.filter(x=>x.own==p.id&&'dmub'.includes(x.st)).length>2&&gain(p,{imp:2}));
G.ps.forEach(p=>{if(G.round==5||M.lawAll||(M.lawData&&G.prods.some(x=>x.own==p.id&&/dữ liệu/.test(TG[x.t][x.v])&&x.st!='x'&&x.st!='w')))G.q.push(n=>lawDraw(p,n))});
WHO=-1;modal(`<h3>Vòng ${G.round}/5 – ${RN[G.round-1]}</h3><p><b>THẺ SỰ KIỆN: ${e[0]}</b><br>${e[1]}</p><p class="tip">💡 ${RT[G.round-1]}</p>${G.round==3?'<p>⚠ Mọi sản phẩm đang SỬ DỤNG bị HỎNG.</p>':''}${G.round==5?'<p>Mỗi người rút 1 Thẻ Pháp luật.</p>':''}`,[['Bắt đầu',runQ]])}
function endTurn(){if(++G.i>=G.ps.length)return endRound();G.acts=G.mod.acts?1:2;render()}
function endRound(){const m=G.mod;G.q=[];
G.ps.forEach(p=>{if(p.role==0&&G.prods.filter(x=>x.own==p.id&&x.st=='b').length>=3){gain(p,{law:-5});log(p.name+': ≥3 SP Hỏng → −5⚖')}
if(m.qcCheck&&p.cnt.ref){p.qc?p.qc=0:(gain(p,{law:-5}),log(p.name+' tân trang không kiểm tra CL: −5⚖'))}
if(m.noWaste&&!p.cnt.w)gain(p,{imp:5});if(m.colImp&&p.cnt.col)gain(p,{imp:3});
p.streak=p.cnt.cl?p.streak+1:0;if(p.streak>=2){p.streak=0;G.q.push(n=>drawOpp(p,n))}});
G.q.push(()=>{if(G.over||G.round>=5)endGame();else{G.round++;startRound()}});runQ()}
// ===== THẺ =====
function lawDraw(p,next,k){const c=nextCard('law'),o=[[c[2],1],[c[3],0]];if(c[8])o.push([c[8],2]);
WHO=p.id;modal(`<h3>⚖ THẺ PHÁP LUẬT – ${c[0]}</h3><p><b>${p.name}</b>: ${c[1]}</p>`,sh(o).map((x,i)=>[String.fromCharCode(65+i)+'. '+x[0],()=>{
const ok=x[1]==1;ok?gain(p,{law:c[4],imp:c[5]}):gain(p,{law:-(x[1]==2?15:c[6]),risk:c[7]||(x[1]==2?1:0)});if(!ok&&k=='n'&&p.role==3)gain(p,{risk:1});
tip('law');log(`${p.name} ⚖ ${c[0]}: ${ok?'đúng':'sai'}`);
WHO=p.id;modal(`<h3>${ok?'✅ Phương án phù hợp':'❌ Rủi ro pháp lý'}</h3><p>${ok?`+${c[4]}⚖ ${c[5]?'+'+c[5]+'♥':''}`:`−${x[1]==2?15:c[6]}⚖ ${c[7]||x[1]==2?'+1⚠':''}`}</p><p><b>Đáp án:</b> ${c[2]}</p><p><i>LEGAL NOTE: Khi thiết bị đi qua vòng tuần hoàn, nghĩa vụ về thông tin, dữ liệu, an toàn và trách nhiệm sau bán đi theo sản phẩm; pháp luật là một phần của quyết định kinh doanh.</i></p>`,[['Tiếp tục',next]])}]))}
function drawOpp(p,next){const c=nextCard('opp');let e=c[1],t='';
if(c[0][0]=='N'&&eff(p).cir<40){e={};t=' (chưa đủ điều kiện)'}
if(c[0][0]=='Đ'&&c[0][1]=='ó'&&!G.prods.some(x=>x.own==p.id&&x.loops>=2)){e={};t=' (chưa có SP đủ 2 giai đoạn)'}
gain(p,e);log(`${p.name} 🎁 ${c[0]}`);WHO=p.id;modal(`<h3>🎁 THẺ CƠ HỘI</h3><p><b>${p.name}</b>: ${c[0]}<br>${fx(e)||'—'}${t}</p>`,[['OK',next]])}
function play(i){const p=cur(),c=p.hand[i];if(G.acts<1)return say('Hết hành động.');if(p.fin<c[1])return say('Không đủ tài chính.');if(c[2].mat<0&&p.mat<-c[2].mat)return say('Không đủ vật liệu.');

const can=(q,k)=>k=='m'?q.role==0:q.cap[CK[k]]>0;
function cost(o,x,k,pv){const m=G.mod;return Math.max(0,k=='r'?x.rc+(m.rc||0)+(m.rcPin&&/pin/i.test(T[x.t][0]+TG[x.t][x.v])?1:0)-(pv.role==2?1:0)-(x.easy?1:0)-o.disc:k=='n'?3-o.rdisc:k=='c'?1+(m.cc||0):1)}
const fee=(o,q)=>q!=o&&!o.free&&!G.mod.hf?1:0;
function svc(id,k,via,ow){const x=G.prods[id],o=ow||cur();if(G.acts<1)return say('Hết hành động trong lượt.');
const L=G.ps.filter(q=>can(q,k)&&q!=via&&(!via||q!=o)).sort((a,b)=>(b==o)-(a==o));if(!L.length)return say('Không ai có năng lực '+SN[k]+'. Hãy thuê người khác hoặc đầu tư năng lực.');
const run=q=>{const pay=cost(o,x,k,q)+fee(o,q);if(o.fin<pay)return say(o.name+' không đủ '+pay+'₫.');
o.fin-=pay;q!=o&&(q.fin+=pay);k!='m'&&q.cap[CK[k]]--;q!=o&&o.free&&!G.mod.hf&&(o.free=0);const m=G.mod;x.loops+=k!='m';
if(k=='m')x.st='m';
if(k=='r'){o.disc=0;x.st='u';gain(o,{cir:8+(m.repCir||0),imp:4,loop:1});G.cnt.r++}
if(k=='n'){o.rdisc=0;x.st='u';o.cnt.ref++;q.cnt.ref++;gain(o,{fin:Math.ceil(T[x.t][2]*.7)+(m.rv||0),cir:10,imp:5,loop:1});q.role==3&&gain(q,{fin:5,cir:5,imp:2});G.cnt.f++}
if(k=='c'){x.st='x';q.cnt.col++;o.cnt.col++;gain(o,{fin:m.recFin||0,mat:2,cir:5,imp:2,loop:q.role==4&&x.rc<=2?0:1});q.role==4&&gain(q,{mat:1});G.cnt.c++}
if(via){tip('link');gain(via,{fin:3,cir:2,imp:3});if(!via.op){via.op=1;G.q.push(n=>drawOpp(via,n))}}
tip(k);log(`${SN[k]} ${pn(x)} (${o.name}${q!=o?' ← '+q.name:''}${via?', kết nối: '+via.name:''}) −${pay}₫`);G.acts--;
if(k=='n'||k=='c')G.q.push(n=>lawDraw(q,n,k));runQ()};
L.length==1?run(L[0]):pick(SN[k]+' '+pn(x)+' – chọn đơn vị thực hiện',L.map(q=>[`${q.name} (${ROLES[q.role][0]}) ${cost(o,x,k,q)+fee(o,q)}₫`,()=>run(q)]))}
function sell(id){const x=G.prods[id],o=cur();if(G.acts<1)return say('Hết hành động.');x.st='u';G.cnt.s++;
gain(o,{fin:T[x.t][2]+(G.mod.sell||0)+(o.role==1?1:0)});if(o.role==1&&o.cap.t>0)gain(o,{imp:2});if(x.easy&&o.role==0)gain(o,{imp:2});
tip('s');log(`${o.name} bán ${pn(x)}`);G.acts--;render()}
function trash(id){const x=G.prods[id],o=cur();if(G.acts<1)return say('Hết hành động.');x.st='w';tip('w');addWaste(1);gain(o,{imp:-3});o.cnt.w=1;log(`🗑 ${o.name} bỏ ${pn(x)} → RÁC (−3♥)`);G.acts--;render()}
function buy(){const o=cur();if(G.acts<1||o.fin<3)return say('Cần 1 hành động và 3₫.');if(!G.dk.prod.length)return say('Hết thẻ Sản phẩm.');o.fin-=3;const c=G.dk.prod.pop();newProd(o.id,c);log(`${o.name} nhận ${pn(G.prods.at(-1))}`);G.acts--;render()}
function invest(){const o=cur();if(G.acts<1||o.fin<3)return say('Cần 1 hành động và 3₫.');const go=f=>{o.fin-=3;f();G.acts--;render()};
pick('Đầu tư 3₫',[['+1 Năng lực Sửa chữa',()=>go(()=>o.cap.r++)],['+1 Năng lực Thu hồi',()=>go(()=>o.cap.t++)],['+1 Năng lực Tân trang',()=>go(()=>o.cap.n++)],...(G.mod.invest&&!o.inv?[['Đầu tư xanh (Sự kiện): +5♻',()=>go(()=>{o.inv=1;gain(o,{cir:5})})]]:[])])}
function trade(){const o=cur(),O=G.ps.filter(q=>q!=o);pick('Giao dịch (không tốn hành động) – gửi cho:',O.map(q=>[q.name,()=>pick('Trao cho '+q.name,[['1₫',()=>o.fin>0&&(o.fin--,q.fin++,log(`${o.name} → ${q.name}: 1₫`),render())],['2₫',()=>o.fin>1&&(o.fin-=2,q.fin+=2,log(`${o.name} → ${q.name}: 2₫`),render())],['1 vật liệu',()=>o.mat>0&&(o.mat--,q.mat++,render())],['1 sản phẩm',()=>pick('Chọn sản phẩm',G.prods.map((x,i)=>[x,i]).filter(([x])=>x.own==o.id&&'dmub'.includes(x.st)).map(([x,i])=>[pn(x)+' ['+x.st+']',()=>{x.own=q.id;log(`${o.name} chuyển ${pn(x)} cho ${q.name}`);render()}]))]])]))}
function connect(){const o=cur();if(G.acts<1)return say('Hết hành động.');const L=G.prods.map((x,i)=>[x,i]).filter(([x])=>x.own!=o.id&&x.st=='b');if(!L.length)return say('Chưa có sản phẩm Hỏng của người khác để kết nối.');
pick('🔗 Kết nối: chọn sản phẩm Hỏng',L.map(([x,i])=>[`${pn(x)} (${G.ps[x.own].name})`,()=>pick('Dịch vụ',['r','n','c'].map(k=>[SN[k],()=>svc(i,k,o,G.ps[x.own])]))]))}
// ===== GIAO DIỆN =====
function board(){const X=(a,r)=>330+250*Math.cos(a*Math.PI/180),Y=a=>235+165*Math.sin(a*Math.PI/180);let s='<svg viewBox="0 0 660 500" style="width:100%"><rect width="660" height="500" rx="16" fill="#e9f0dc"/><ellipse cx="330" cy="235" rx="250" ry="165" fill="#f7f3dc" stroke="#8bb58f" stroke-width="3" stroke-dasharray="8 6"/>';
s+='<text x="330" y="215" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6b45">CIRCULAR</text><text x="330" y="245" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6b45">LAW LAB</text><text x="330" y="268" text-anchor="middle" font-size="12" fill="#1f6b45">CLOSE THE LOOP</text>';
s+='<text x="330" y="490" text-anchor="middle" font-size="11" fill="#555">Thẻ còn lại — SK '+G.dk.ev.length+' · HĐ '+G.dk.act.length+' · PL '+G.dk.law.length+' · SP '+G.dk.prod.length+' · CH '+G.dk.opp.length+'</text>';
NODES.forEach(([k,l,ic,c,a],j)=>{const x=X(a),y=Y(a);s+=`<circle cx="${x}" cy="${y}" r="34" fill="${c}"/><text x="${x}" y="${y-2}" text-anchor="middle" font-size="18">${ic}</text><text x="${x}" y="${y+14}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">${l}</text>`;
if('srfc'.includes(k))s+=`<text x="${x}" y="${y+50}" text-anchor="middle" font-size="12" font-weight="700" fill="${c}">×${G.cnt[k]}</text>`;
else G.prods.filter(p=>p.st==k).forEach((p,n)=>{s+=`<circle cx="${x-30+n%4*20}" cy="${y+48+(n/4|0)*20}" r="9" fill="${ROLES[G.ps[p.own].role][2]}" stroke="#fff"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet"><title>${pn(p)} – ${G.ps[p.own].name}</title></circle><text x="${x-30+n%4*20}" y="${y+52+(n/4|0)*20}" text-anchor="middle" font-size="11">${T[p.t][1]}</text>`})});
return s+'</svg><div class="w">🗑 KHỦNG HOẢNG RÁC THẢI: '+[...Array(11)].map((_,i)=>`<span style="${i<=G.waste?'background:#d33;color:#fff':''}">${i}</span>`).join('')+'</div>'}
function bars(p){const e=eff(p);return [['cir','♻ Tuần hoàn',60,'#3aa76d'],['law','⚖ Tuân thủ PL',70,'#3b7dd8'],['imp','♥ Tác động',50,'#8a5cc0']].map(([k,l,n,c])=>`<div>${l}: <b>${e[k]}</b>/${n} ${e[k]>=n?'✅':''}<div class="bar"><i style="width:${Math.min(100,e[k])}%;background:${c}"></i><b style="left:${n}%"></b></div></div>`).join('')}
function render(){if(G.over)return endGame();const cp=cur(),p=NET&&me>=0?G.ps[me]:cp,R=ROLES[p.role],own=(!NET||me>=0)&&p==cp,CR=ROLES[cp.role];$('hd').innerHTML=`Vòng ${G.round}/5 – ${RN[G.round-1]} · Lượt: <b>${cp.name}</b> (${CR[1]} ${CR[0]}) · Hành động: <b>${G.acts}</b>${NET?' · Phòng '+room:''}`;
const mine=G.prods.map((x,i)=>[x,i]).filter(([x])=>x.own==p.id&&x.st!='x'&&x.st!='w'),d=G.acts<1||!own?'disabled':'';
$('app').innerHTML=`<div><div class="c">${board()}</div><div class="c"><b>Sự kiện vòng này:</b> ${EV.find(e=>e[2]==G.mod)?.[0]||''}<br><b>Bảng điểm</b><table><tr><th></th><th>₫</th><th>♻</th><th>⚖</th><th>♥</th><th>↻</th><th>⚠</th></tr>${G.ps.map(q=>{const e=eff(q);return `<tr style="${q==cp?'background:#fff3c4':''}"><td>${ROLES[q.role][1]} ${q.name}</td><td>${e.fin}</td><td>${e.cir}</td><td>${e.law}</td><td>${e.imp}</td><td>${q.loops}</td><td>${q.risk}</td></tr>`}).join('')}</table></div><div class="c"><b>Nhật ký</b><div style="max-height:140px;overflow:auto;font-size:12px">${G.log.slice(0,25).map(x=>'<div>'+x+'</div>').join('')}</div></div></div>
<div><div class="c" style="border-top:6px solid ${R[2]}"><h3 style="margin:0">${R[1]} ${p.name} – ${R[0]} ${NET?(own?'🎯 Đến lượt bạn!':'(chờ '+cp.name+')'):''}</h3><small>${R[7]}</small><p style="font-size:20px;margin:6px 0"><b>${p.fin}₫</b></p>${bars(p)}
<p>Năng lực: <span class="p">🔧 ${p.cap.r}</span><span class="p">↩ ${p.cap.t}</span><span class="p">◆ ${p.cap.n}</span> <span class="p">▣ Vật liệu ${p.mat}</span><span class="p">⚠ Rủi ro ${p.risk}</span><span class="p">↻ Vòng lặp ${p.loops}</span>${p.disc?'<span class="p">sửa −'+p.disc+'</span>':''}${p.rdisc?'<span class="p">tân trang −'+p.rdisc+'</span>':''}${p.qc?'<span class="p">KT chất lượng</span>':''}${p.free?'<span class="p">GD miễn phí</span>':''}</p></div>
<div class="c"><b>Sản phẩm đang quản lý</b>${mine.map(([x,i])=>`<div style="margin:4px 0;border-bottom:1px solid #eee"><b>${pn(x)}</b> <small>(${TG[x.t][x.v]}${x.easy?', dễ sửa':''}) giá ${T[x.t][2]} · sửa ${x.rc}</small> <span class="p">${{d:'THIẾT KẾ',m:'SẢN XUẤT',u:'SỬ DỤNG',b:'HỎNG'}[x.st]}</span><br>${x.st=='d'?`<button ${d} onclick="X('svc',${i},'m')">Sản xuất</button>`:x.st=='m'?`<button ${d} onclick="X('sell',${i})">Bán → Sử dụng</button>`:x.st=='b'?`<button ${d} onclick="X('svc',${i},'r')">🔧 Sửa</button><button ${d} onclick="X('svc',${i},'n')">🔄 Tân trang ⚖</button><button ${d} onclick="X('svc',${i},'c')">♻ Tái chế ⚖</button><button class="a" ${d} onclick="X('trash',${i})">🗑 Bỏ</button>`:''}</div>`).join('')||'<i>Không có</i>'}</div>
<div class="c"><b>Thẻ Hành động (${p.hand.length})</b><br>${p.hand.map((c,i)=>`<div class="k"><b>${c[0]}</b><br>Chi phí ${c[1]}₫<br>${fx(c[2])}<br><button ${d} onclick="X('play',${i})">Dùng</button></div>`).join('')||'<i>Không có</i>'}</div>
<div class="c"><button ${d} onclick="X('buy')">➕ Nhận SP (3₫)</button><button ${d} onclick="X('invest')">📈 Đầu tư (3₫)</button><button class="a" ${own?'':'disabled'} onclick="X('trade')">🤝 Giao dịch</button>${p.role==5?`<button ${d} onclick="X('connect')">🔗 Kết nối</button>`:''}<button style="background:#ff8c42" ${own?'':'disabled'} onclick="X('endTurn')">Kết thúc lượt ▶</button><br><small>Sửa/tân trang/tái chế: nếu bạn thiếu năng lực, hệ thống cho thuê người khác (trả chi phí +1₫ phí kết nối). ⚖ = rút Thẻ Pháp luật.</small></div></div>`}
function endGame(){const all=G.waste>=10,r=G.ps.map(p=>({p,e:eff(p)}));r.forEach(x=>x.ok=!all&&x.e.cir>=60&&x.e.law>=70&&x.e.imp>=50);
const w=r.filter(x=>x.ok).sort((a,b)=>b.e.fin-a.e.fin||b.p.loops-a.p.loops||b.e.imp-a.e.imp);$('hd').textContent='KẾT THÚC VÁN CHƠI';
$('app').innerHTML=`<div class="c" style="grid-column:1/-1"><h2>${all?'🗑 Thanh Khủng hoảng Rác thải đạt 10 – TẤT CẢ THẤT BẠI':w.length?'🏆 Người chiến thắng: '+w[0].p.name+' ('+ROLES[w[0].p.role][0]+')':'Không ai đạt cả 3 điều kiện – tất cả thất bại'}</h2>
<table><tr><th>Người chơi</th><th>Tài chính</th><th>♻ (≥60)</th><th>⚖ (≥70)</th><th>♥ (≥50)</th><th>Vòng lặp</th><th>Kết quả</th></tr>${r.map(x=>`<tr><td>${ROLES[x.p.role][1]} ${x.p.name}</td><td>${x.e.fin}</td><td>${x.e.cir}</td><td>${x.e.law}</td><td>${x.e.imp}</td><td>${x.p.loops}</td><td>${x.ok?'✅ Mô hình tuần hoàn hoàn thành':'❌'}</td></tr>`).join('')}</table>
<p><small>♻ = thanh + 5×Vòng lặp · ⚖ = thanh − 5×Rủi ro · Hòa: Tài chính → Vòng lặp → Tác động.</small></p>
<h3>💡 Kiến thức bạn đã gặp</h3><ul>${[...LEARN].map(k=>'<li>'+TIPS[k][0]+'</li>').join('')}</ul><h3>3 câu hỏi sau ván</h3><ol><li>Quyết định nào giúp tôi kiếm nhiều tiền nhất?</li><li>Quyết định nào giúp tôi tạo nhiều vòng tuần hoàn nhất?</li><li>Quyết định nào khiến tôi gặp rủi ro pháp lý lớn nhất? Nếu là doanh nghiệp thật, tôi sẽ đổi quyết định nào?</li></ol>
<h3>QR Circular Action – hành động ngoài đời thật</h3><ul><li>Sửa thay vì vứt</li><li>Trao đổi thay vì mua mới</li><li>Đưa thiết bị điện tử hỏng đến điểm thu hồi</li><li>Xóa dữ liệu trước khi trao đổi thiết bị</li><li>Tìm hiểu tân trang thiết bị cũ</li></ul><button onclick="setup()">Chơi lại</button></div>`}
setup();
</script></body></html>
